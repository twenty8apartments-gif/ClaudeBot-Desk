name: Tracker (hourly)
on:
  schedule:
    - cron: "55 * * * 0-5"   # every hour at :55 UTC, Sun–Fri (covers the Sun–Fri FX/futures week)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bots/tracker.py
      - run: 'scripts/commit-data.sh "Tracker: hourly prices"'
