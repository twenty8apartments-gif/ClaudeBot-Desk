name: Journal (daily)
on:
  schedule:
    - cron: "37 19 * * 1-5"  # 23:37 Mauritius, Mon–Fri
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bots/journal.py
      - run: 'scripts/commit-data.sh "Journal: daily review"'
